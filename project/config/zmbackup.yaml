# zmbackup configuration file (Java tool).
#
# Equivalent of zmbackup.conf for the bash tool. Installed at /etc/zmbackup/zmbackup.yaml.
# The curly-brace tokens below are filled in by install-java.sh; if you are reading this
# file as a template rather than an installed copy, replace them by hand.

zimbraLdap:
  # LDAP server URL.
  url: ldap://{OSE_INSTALL_ADDRESS}:389
  # Admin distinguished name used to bind.
  bindDn: uid=zimbra,cn=admins,cn=zimbra
  # Admin password used to bind.
  bindPassword: {OSE_INSTALL_LDAPPASS}
  # Whether to use SSL when talking to the Zimbra server. Optional, defaults to true.
  sslEnabled: true
  # Path to a PEM-encoded CA certificate (bundle) used to verify the LDAP server's certificate
  # during StartTLS negotiation, e.g. Zimbra's self-signed CA at
  # /opt/zimbra/ssl/zimbra/ca/ca.pem. Optional; if unset, the JVM's default trust manager is
  # used (or, if trustAllCertificates is true, any certificate is trusted).
  # caCertificatePath: /opt/zimbra/ssl/zimbra/ca/ca.pem
  # Whether to accept any LDAP server certificate when caCertificatePath is not set. This does
  # NOT protect against an active MITM attack; only enable it for self-signed Zimbra certs in
  # dev/test environments. Optional, defaults to false.
  trustAllCertificates: false
  # How long a single LDAP operation (bind, search, add, delete) may take once connected before
  # it's abandoned as hung. Discovery searches the whole directory in one request, so a very
  # large directory may need more than the default. Optional, defaults to 600 (10 minutes).
  # responseTimeoutSeconds: 600

zimbraMailbox:
  # Zimbra service account used to start/stop the service.
  backupUser: {OSE_USER}
  # Whether to include disabled accounts. Optional, defaults to true.
  backupInactiveAccounts: true
  # Zimbra server's REST base URL, used to export mailbox content.
  restBaseUrl: https://{OSE_INSTALL_ADDRESS}:7071
  # Zimbra admin account used for REST HTTP Basic authentication. Must be a real Zimbra login
  # (e.g. admin@yourdomain.com), not the OS service account - Zimbra's REST servlet rejects the
  # latter with a 401 regardless of password.
  adminUser: {ZMBKP_REST_ADMIN}
  # The admin account's own Zimbra password - not the LDAP bind password above; Zimbra
  # provisions these as separate credentials even when zmbackup runs on the mailbox host itself.
  adminPassword: {ZMBKP_REST_ADMIN_PASS}
  # Path to a PEM-encoded CA certificate (bundle) used to verify the mailbox REST server's
  # certificate, e.g. Zimbra's self-signed CA at /opt/zimbra/ssl/zimbra/ca/ca.pem. Optional; if
  # unset, the JVM's default trust manager is used (or, if trustAllCertificates is true, any
  # certificate is trusted).
  # caCertificatePath: /opt/zimbra/ssl/zimbra/ca/ca.pem
  # Whether to accept any mailbox REST server certificate when caCertificatePath is not set. This
  # does NOT protect against an active MITM attack; only enable it for self-signed Zimbra certs in
  # dev/test environments. Optional, defaults to false.
  trustAllCertificates: false

backup:
  # Directory backups and session metadata are stored under.
  workDir: {OSE_DEFAULT_BKP_DIR}
  # Path zmbackup writes its logs to.
  logFile: {OSE_INSTALL_DIR}/log/zmbackup.log
  # Path to the file listing accounts that should never be backed up.
  blockedListFile: {ZMBKP_CONF}/blockedlist.conf
  # How many accounts to back up concurrently. Optional, defaults to 3.
  maxParallelProcesses: {MAX_PARALLEL_PROCESS}
  # How many days of backups to keep before housekeeping deletes them. Optional, defaults to 30.
  rotateDays: {ROTATE_TIME}
  # Whether to allow only one backup session per type per day. Optional, defaults to true.
  lockBackup: {LOCK_BACKUP}
  emailNotify:
    # Which lifecycle events to notify on: ALL, START, FINISH, ERROR, or NONE. Optional, defaults to ALL.
    level: ALL
    # Address a report is sent to after each run.
    recipient: {ZMBKP_MAIL_ALERT}
    # Address the report is sent from.
    sender: {ZMBKP_MAIL_SENDER}

# Where backup content (LDIF/TGZ files) is stored. Optional; both sections below default to the
# local filesystem, matching zmbackup 1.0/2.0 Phase 1 behavior. Set backend: s3 to store backup
# content in Amazon S3 instead - see zmbackupdocs specs/13-cloud-backends.md.
storage:
  backend: local
  # s3:
  #   bucket: my-zmbackup-bucket
  #   region: us-east-1
  #   prefix: sessions/

# Where session/account metadata is stored. Optional; defaults to the local SQLite database
# alongside workDir above. Set backend: dynamodb to store metadata in DynamoDB instead, and to
# switch the run lock from a local PID file to a DynamoDB-based distributed lock - see
# zmbackupdocs specs/13-cloud-backends.md.
metadata:
  backend: sqlite
  # dynamodb:
  #   region: us-east-1
  #   sessionTable: zmbackup_session
  #   accountTable: zmbackup_account
  #   lockTable: zmbackup_lock

# Explicit opt-in required to start with a setting that sends credentials in cleartext or skips
# certificate verification (sslEnabled: false, trustAllCertificates: true with no
# caCertificatePath, a non-https:// restBaseUrl, or a non-https:// storage/metadata
# endpointOverride). zmbackup refuses to start with such a setting unless this is true. Optional,
# defaults to false.
allowInsecure: false
