
# Use the latest 2.1 version of CircleCI pipeline process engine.
# See: https://circleci.com/docs/reference/configuration-reference
version: 2.1

jobs:
  test:
    docker:
      - image: cimg/node:lts
    steps:
      - checkout
      - run:
          name: Install system dependencies
          command: sudo apt-get update -qq && sudo apt-get install -y sqlite3
      - run:
          name: Install dependencies
          command: npm install
      - run:
          name: Run unit tests
          command: npx bats --verbose-run tests/unit/

  test-java:
    docker:
      - image: cimg/openjdk:21.0
    steps:
      - checkout
      - run:
          name: Run Java tests
          command: ./gradlew test
      - run:
          name: Collect JUnit test results
          command: |
            mkdir -p ~/test-results/junit
            find . -path '*/build/test-results/test' -type d \
              -exec sh -c 'cp -R "$1"/*.xml ~/test-results/junit/ 2>/dev/null' _ {} \;
          when: always
      - store_test_results:
          path: ~/test-results/junit
      - store_artifacts:
          path: ~/test-results/junit

workflows:
  test-workflow:
    jobs:
      - test
      - test-java
