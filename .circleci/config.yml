
# Use the latest 2.1 version of CircleCI pipeline process engine.
# See: https://circleci.com/docs/reference/configuration-reference
version: 2.1

jobs:
  test:
    docker:
      - image: cimg/node:lts
    steps:
      - checkout
      - run:
          name: Install system dependencies
          command: sudo apt-get update -qq && sudo apt-get install -y sqlite3
      - run:
          name: Install dependencies
          command: npm install
      - run:
          name: Run unit tests
          command: npx bats --verbose-run tests/unit/

  test-java:
    docker:
      - image: cimg/openjdk:21.0
    steps:
      - checkout
      - run:
          name: Run Java tests and static analysis
          command: ./gradlew check
      - run:
          name: Collect JUnit test results
          command: |
            mkdir -p ~/test-results/junit
            find . -path '*/build/test-results/test' -type d \
              -exec sh -c 'cp -R "$1"/*.xml ~/test-results/junit/ 2>/dev/null' _ {} \;
          when: always
      - store_test_results:
          path: ~/test-results/junit
      - store_artifacts:
          path: ~/test-results/junit
      - run:
          name: Collect JaCoCo coverage reports
          command: |
            mkdir -p ~/reports/jacoco
            for html_dir in */build/reports/jacoco/test/html; do
              [ -d "$html_dir" ] || continue
              module="${html_dir%%/build/*}"
              mkdir -p ~/reports/jacoco/"$module"
              cp -R "$html_dir"/. ~/reports/jacoco/"$module"/
            done
          when: always
      - store_artifacts:
          path: ~/reports/jacoco
      - run:
          name: Collect SpotBugs reports
          command: |
            mkdir -p ~/reports/spotbugs
            for report_dir in */build/reports/spotbugs; do
              [ -d "$report_dir" ] || continue
              module="${report_dir%%/build/*}"
              mkdir -p ~/reports/spotbugs/"$module"
              cp -R "$report_dir"/. ~/reports/spotbugs/"$module"/
            done
          when: always
      - store_artifacts:
          path: ~/reports/spotbugs

  shellcheck:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: Install ShellCheck
          command: sudo apt-get update -qq && sudo apt-get install -y shellcheck
      - run:
          name: Run ShellCheck on the installer entrypoint
          command: |
            shellcheck -x --check-sourced install-java.sh

workflows:
  test-workflow:
    jobs:
      - test
      - test-java
      - shellcheck
